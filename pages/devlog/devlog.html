<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>Dev log</title>

		<link href="/css/colorschemes/matrix.css" rel="stylesheet">
		<link href="/css/globals.css" rel="stylesheet">
		<link href="/css/tooltip.css" rel="stylesheet">
		<link href="/css/theme_switcher.css" rel="stylesheet">
		<link href="/css/codeblock.css" rel="stylesheet">
		<link href="/css/devlog.css" rel="stylesheet">

		<script src="/script/tooltip.js"></script>
		<script src="/script/theme_switcher.js" type="module"></script>
		<script src="/script/syntaxHighlight.js"></script>
		<script type="module">
			import { sinceNow } from "/script/utils/time_format.js";
			document.addEventListener("DOMContentLoaded", () => {
				document.querySelectorAll(".commandline.sh").forEach((block) => {syntaxHighlight(block, "sh")});
				document.querySelectorAll(".commandline.nu").forEach((block) => {syntaxHighlight(block, "nu")});
				document.querySelectorAll(".ls-output.nu > tbody > tr > td:nth-of-type(5)").forEach((td) => {
					const timestamp = td.textContent;
					const sd = sinceNow(timestamp);
					td.textContent = sd;
					
					});
					})
		</script>
	</head>
	<body>

		<div id="backlink">
			<a href="/index.html">cd ~</a>
		</div>

		<div id="toolbar"></div>

		<div class="content-body">
			<h1>Dev Log</h1>

			<section>
				<div class="prompt-divider">
					<span class="prompt-left">devlog</span>
					<span class="prompt-right"></span>
				</div>

				<h2 class="commandline nu">ls -t *.html | sort-by modified -r</h2>
				<table class="ls-output nu">
					<thead><tr>
						<th scope="col">#</th>
						<th scope="col">name</th>
						<th scope="col">type</th>
						<th scope="col">tags</th>
						<th scope="col">modified</th>
					</tr></thead>
					<tbody>
						<tr>
							<td>0</td><td><a href="/pages/devlog/media_files.html">media_files.html</a></td><td>file</td>
							<td><table class="ls-output nu"><thead><tr><th scope="col">#</th><th scope="col">name</th></tr></thead><tbody>
								<tr><td>0</td><td>image</td></tr>
								<tr><td>1</td><td>video</td></tr>
								<tr><td>2</td><td>nushell</td></tr>
								<tr><td>3</td><td>ffmpeg</td></tr>
								<tr><td>4</td><td>image_magick</td></tr>
							</tbody></table></td>
							<td>2026-03-31T02:22:38.000+00:00</td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>
	</body>
</html>
